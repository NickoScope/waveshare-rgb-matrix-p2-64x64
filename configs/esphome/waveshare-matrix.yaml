# Минимальный рабочий конфиг ESPHome
# Плата:  Waveshare ESP32-S3-RGB-Matrix (SKU 34422)
# Панель: Waveshare RGB-Matrix-P2-64x64-B (SKU 33838), одна штука
#
# ВНИМАНИЕ. Этот конфиг в сессии сборки базы знаний НЕ компилировался и НЕ заливался.
# Распиновка взята из packages/controllers/waveshare-esp32-s3-rgb-matrix.yaml проекта
# hub75-studio (MIT, (c) 2026 Wade Edwards), а не из официальной схемы Waveshare.
# Сверить со схемами в hardware/schematics репозитория waveshareteam/ESP32-S3-RGB-Matrix.
#
# Требуется ESPHome 2025.12 или новее: компонент hub75 появился в ядре начиная с неё.
# Фреймворк строго esp-idf.

substitutions:
  name: waveshare-matrix
  friendly_name: LED Matrix

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# Плата несёт 16 МБ octal PSRAM. Без этого блока крупные буферы не поместятся.
psram:
  mode: octal
  speed: 80MHz

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

font:
  - file: "gfonts://Roboto"
    id: font_main
    size: 12

# ── Панель ──
# Значения ниже соответствуют тому, что Waveshare задаёт в своём menuconfig:
# Standard scan, драйвер Generic, 8 бит, 20 МГц, минимум 60 Гц, яркость 128.
display:
  - platform: hub75
    id: matrix
    panel_width: 64
    panel_height: 64

    # Распиновка платы. НЕ ПРОВЕРЕНО по официальной схеме, см. шапку файла.
    r1_pin: GPIO4
    g1_pin: GPIO5
    b1_pin: GPIO6
    r2_pin: GPIO7
    g2_pin: GPIO15
    b2_pin: GPIO16
    a_pin: GPIO18
    b_pin: GPIO8
    c_pin: GPIO3
    d_pin: GPIO42
    e_pin: GPIO9        # обязателен: панель 64 строки, развёртка 1/32
    lat_pin: GPIO40
    oe_pin: GPIO2
    clk_pin: GPIO41

    shift_driver: GENERIC
    scan_wiring: STANDARD_TWO_SCAN
    bit_depth: 8
    clock_speed: 20MHZ
    min_refresh_rate: 60
    latch_blanking: 1
    clock_phase: false
    brightness: 128     # не поднимать выше без запаса по питанию
    gamma_correct: CIE1931
    double_buffer: false
    update_interval: 16ms

    lambda: |-
      it.printf(2, 2, id(font_main), Color(0, 200, 255), "HELLO");
      it.rectangle(0, 0, 64, 64, Color(40, 40, 40));

# ── Яркость из Home Assistant ──
number:
  - platform: template
    name: "Brightness"
    id: matrix_brightness
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 128
    optimistic: true
    set_action:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda return (int) x;

# ── Датчики на плате ──
# SHTC3 на 0x70, часы реального времени PCF85063 на 0x51.
i2c:
  sda: GPIO47
  scl: GPIO48
  id: bus_i2c

sensor:
  - platform: shtcx
    i2c_id: bus_i2c
    address: 0x70
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 60s

time:
  - platform: pcf85063
    i2c_id: bus_i2c
    address: 0x51
    id: rtc_time
  - platform: sntp
    id: net_time
    on_time_sync:
      then:
        - pcf85063.write_time:
