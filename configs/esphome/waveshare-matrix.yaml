# Minimal ESPHome configuration
# Board: Waveshare ESP32-S3-RGB-Matrix (SKU 34422)
# Panel: Waveshare RGB-Matrix-P2-64x64-B (SKU 33838), one unit
#
# Pin assignments VERIFIED 2026-09-06 against Waveshare's own firmware sources:
#   example/idf_v5.5.2/components/bsp/esp32_s3_matrix/include/bsp/config.h
#   example/idf_v5.5.2/sdkconfig.defaults
#   example/arduino_v3.3.7/01_SimpleTestShapes/platforms/esp32s3/esp32s3-default-pins.hpp
# All agree pin for pin.
#
# NOTE: this config has not been compiled or flashed. Treat it as a reviewed draft.
#
# Requires ESPHome 2025.12 or newer: the hub75 component landed in core with that release.
# Framework must be esp-idf.

substitutions:
  name: waveshare-matrix
  friendly_name: LED Matrix

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 32MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

# The board carries 16 MB of octal PSRAM. Larger buffers will not fit without this.
psram:
  mode: octal
  speed: 80MHz

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

font:
  - file: "gfonts://Roboto"
    id: font_main
    size: 12

# ── Panel ──
# Values below follow Waveshare's own menuconfig guidance:
# standard scan wiring, Generic driver, 8-bit depth, 20 MHz, 60 Hz floor, brightness 128.
#
# On shift_driver: the user guide and the ESP-IDF config indicate GENERIC, but seven of
# Waveshare's ten Arduino examples set FM6126A, and a third party has verified FM6126A on
# real Waveshare P2.5 64x64 panels. Ours is the P2 GOB, so it is left at GENERIC here.
# If the screen stays black on known-good power, FM6126A is the first thing to change.
# If the rightmost column goes missing, that is clock_phase, not the driver.
# See docs/07-sources.md, contradiction 4.
display:
  - platform: hub75
    id: matrix
    panel_width: 64
    panel_height: 64

    r1_pin: GPIO4
    g1_pin: GPIO5
    b1_pin: GPIO6
    r2_pin: GPIO7
    g2_pin: GPIO15
    b2_pin: GPIO16
    a_pin: GPIO18
    b_pin: GPIO8
    c_pin: GPIO3
    d_pin: GPIO42
    e_pin: GPIO9        # mandatory: 64 rows, 1/32 scan
    lat_pin: GPIO40
    oe_pin: GPIO2
    clk_pin: GPIO41

    shift_driver: GENERIC
    scan_wiring: STANDARD_TWO_SCAN
    bit_depth: 8
    clock_speed: 20MHZ
    min_refresh_rate: 60
    latch_blanking: 1
    clock_phase: false
    brightness: 128     # do not raise without power headroom
    gamma_correct: CIE1931
    double_buffer: false
    update_interval: 16ms

    lambda: |-
      it.printf(2, 2, id(font_main), Color(0, 200, 255), "HELLO");
      it.rectangle(0, 0, 64, 64, Color(40, 40, 40));

# ── Brightness entity for Home Assistant ──
number:
  - platform: template
    name: "Brightness"
    id: matrix_brightness
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 128
    optimistic: true
    set_action:
      - hub75.set_brightness:
          id: matrix
          brightness: !lambda return (int) x;

# ── Onboard sensors ──
# I2C bus runs at 400 kHz. SHTC3 at 0x70, PCF85063 RTC at 0x51.
i2c:
  sda: GPIO47
  scl: GPIO48
  frequency: 400kHz
  id: bus_i2c

sensor:
  - platform: shtcx
    i2c_id: bus_i2c
    address: 0x70
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
    update_interval: 60s

time:
  - platform: pcf85063
    i2c_id: bus_i2c
    address: 0x51
    id: rtc_time
  - platform: sntp
    id: net_time
    on_time_sync:
      then:
        - pcf85063.write_time:

# ── BOOT button ──
binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true

# ── Additional hardware available on this board, not configured here ──
#   I2S audio:  BCLK GPIO43, MCLK GPIO12, LRCLK GPIO38
#               speaker out GPIO21 (ES8311), microphone in GPIO39 (ES7210)
#               power amp enable GPIO11
#   TF card:    D0 GPIO17, CMD GPIO44, CLK GPIO1 (1-bit MMC mode only)
#   IMU:        QMI8658 on the same I2C bus
# See docs/02-controller.md for the complete pin map.
