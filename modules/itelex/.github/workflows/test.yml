name: tests
on: [push, pull_request]
jobs:
  host-and-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (ASan/UBSan)
        run: test/run_host_tests.sh
      - name: Interop with piTelex (the i-Telex reference implementation)
        run: |
          git clone --depth 1 https://github.com/fablab-wue/piTelex /tmp/piTelex
          git -C /tmp/piTelex log -1 --format='piTelex %h %cd'
          python3 test/interop/run_pitelex_interop.py --pitelex /tmp/piTelex
