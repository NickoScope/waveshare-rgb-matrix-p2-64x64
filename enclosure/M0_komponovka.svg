<text x="355.00" y="243.77" font-size="3.50" fill="#4a5a68" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">выбор, а не неизвестное.</text>
<text x="355.00" y="248.50" font-size="3.50" fill="#4a5a68" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif"></text>
