<text x="355.00" y="234.32" font-size="3.50" fill="#4a5a68" text-anchor="start" font-weight="normal" font-family="Helvetica,Arial,sans-serif">высоту разъёмов и высоту контроллера с жгутом. В модели это именованные</text>
