<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1380" viewBox="0 0 1180 1380"><rect width="1180" height="1380" fill="#fbfaf7"/>
<text x="40.0" y="34.0" font-family="Helvetica,Arial" font-size="21" fill="#12202b" text-anchor="start" font-weight="bold">Корпус LED MATRIX — акрил 4 мм, лазерная резка</text>
<text x="40.0" y="54.0" font-family="Helvetica,Arial" font-size="11.5" fill="#6b7d88" text-anchor="start" font-weight="normal">Концепция. Конструкция как у корпуса NickoScope32 v1b: шипы плюс резьбовые стойки через монтажные отверстия матриц.</text>
<text x="40.0" y="92.0" font-family="Helvetica,Arial" font-size="12" fill="#1f7a5a" text-anchor="start" font-weight="bold">1 · ВИД СПЕРЕДИ</text>
<rect x="40.0" y="110.0" width="537.2" height="341.9" rx="9.3" fill="#ffffff" stroke="#12202b" stroke-width="1.6"/>
<rect x="61.7" y="131.7" width="396.8" height="198.4" rx="0" fill="#101820" stroke="#12202b" stroke-width="1.2"/>
<line x1="260.1" y1="131.7" x2="260.1" y2="330.1" stroke="#2f4a5c" stroke-width="0.7" stroke-dasharray="3 3"/>
<text x="260.1" y="126.7" font-family="Helvetica,Arial" font-size="8.5" fill="#a8451f" text-anchor="middle" font-weight="normal">стык — ни ребра, ни зазора</text>
<circle cx="536.9" cy="345.6" r="10.8" fill="#e8edf0" stroke="#12202b" stroke-width="1.2"/>
<circle cx="536.9" cy="345.6" r="5.7" fill="none" stroke="#6b7d88" stroke-width="0.8"/>
<text x="522.9" y="349.6" font-family="Helvetica,Arial" font-size="9" fill="#6b7d88" text-anchor="end" font-weight="normal">энкодер</text>
